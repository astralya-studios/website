<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050713">
  <meta name="description" content="Astralya — a living celestial world for Stargazers.">
  <title>Astralya — Stargazer</title>
  <link rel="stylesheet" href="styles.css">
  <script type="importmap">
    {"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js"}}
  </script>
</head>
<body>
  <main id="experience" class="experience">
    <canvas id="world" aria-label="Interactive Astralya entrance"></canvas>
    <div class="vignette" aria-hidden="true"></div>
    <div class="grain" aria-hidden="true"></div>
    <section class="opening-copy" id="opening-copy" aria-live="polite">
      <div class="eyebrow">ASTRALYA</div>
      <h1 id="title">A world waiting for you.</h1>
      <p id="instruction">Tap the door to enter</p>
    </section>
    <section class="welcome-copy" id="welcome-copy" aria-live="polite">
      <p class="eyebrow">THE SKY WORLD</p>
      <h2 id="welcome-title">Welcome, Stargazer.</h2>
      <p id="welcome-sub">The stars have aligned.</p>
      <button id="chart" type="button">Begin your chart</button>
    </section>
    <button class="door-hit" id="door-hit" type="button" aria-label="Open the door"></button>
  </main>
  <script type="module" src="script.js"></script>
</body>
</html>
